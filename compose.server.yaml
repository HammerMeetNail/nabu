# Production compose file — deployed to /opt/nabu/compose.yaml by CI/CD
# App shares the nabu_default network with the standalone nabu_postgres_1 container.
# Postgres is run separately (see cloud-init.yaml for provisioning).

services:
  app:
    # Compose retains this check when the image uses OCI format, which omits
    # Dockerfile HEALTHCHECK metadata in Podman/Buildah builds.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/ready"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    image: quay.io/nabu/nabu:latest   # CI substitutes digest at deploy time
    ports:
      - "8082:8080"
    environment:
      - PORT=8080
      - APP_ENV=production
      - APP_BASE_URL=https://nabu-app.com
      - SERVER_SECURE=true
      - DATABASE_URL=postgres://nabu:${DB_PASSWORD}@nabu_postgres_1:5432/nabu?sslmode=disable
      - SMTP_HOST=smtp.resend.com
      - SMTP_PORT=587
      - SMTP_USER=resend
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=noreply@yearofbingo.com
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      # Apple: all empty until the owner provisions the developer account;
      # every feature they gate (APNs push, AASA/universal links, native +
      # web Sign in with Apple) degrades to disabled while unset.
      - APNS_AUTH_KEY_P8=${APNS_AUTH_KEY_P8:-}
      - APNS_KEY_ID=${APNS_KEY_ID:-}
      - APNS_TEAM_ID=${APNS_TEAM_ID:-}
      - APNS_BUNDLE_ID=${APNS_BUNDLE_ID:-}
      - APPLE_CLIENT_IDS=${APPLE_CLIENT_IDS:-}
      - APPLE_WEB_CLIENT_ID=${APPLE_WEB_CLIENT_ID:-}
      # cloudflared runs on this host and connects from loopback, so the only
      # trusted proxy is 127.0.0.1/::1. Without this, every request's client IP
      # collapses to the tunnel address: /api/auth rate limiting becomes a
      # single sitewide bucket (one attacker = login DoS for everyone) and the
      # per-client global /api/* backstop is never constructed. If cloudflared
      # ever moves to another host, widen this to that peer's address.
      - TRUSTED_PROXY_CIDRS=127.0.0.1/32,::1/128
    restart: unless-stopped
    networks:
      - nabu_default

networks:
  nabu_default:
    external: true
