# Run the release image in local development mode (plain HTTP on localhost).
# The real production HTTPS configuration is in compose.server.yaml.
# Usage: podman compose -f compose.prod.yaml up

services:
  app:
    # Compose retains this check when the image uses OCI format, which omits
    # Dockerfile HEALTHCHECK metadata in Podman/Buildah builds.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/ready"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    image: quay.io/nabu/nabu:latest
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      APP_ENV: "development"
      APP_BASE_URL: "http://localhost:8080"
      DATABASE_URL: "postgres://nabu:nabu@postgres:5432/nabu?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: nabu
      POSTGRES_PASSWORD: nabu
      POSTGRES_DB: nabu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nabu -d nabu"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
